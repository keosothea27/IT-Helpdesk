.g3{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px;margin-bottom:14px}
.cd{background:var(--sf);border:1px solid var(--bd);border-radius:6px;padding:14px;margin-bottom:12px}.g3 .cd{margin:0}.cd p{margin:4px 0}

dialog{border:1px solid var(--bd);border-radius:8px;background:var(--sf);color:var(--tx);width:min(520px,94vw);padding:18px;max-height:92vh;overflow:auto}
dialog label{display:block;font-size:13px;color:var(--mu);margin-bottom:10px}dialog input,dialog select,dialog textarea{display:block;width:100%;margin-top:3px}
@media(max-width:800px){.app{flex-direction:column}nav{width:auto;height:auto;max-height:45vh;position:static}}
@media print{nav,.bar,.tools,button{display:none!important}.app{display:block}}
</style>

tool:'<path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/>',

chev:'<path d="M6 9l6 6 6-6"/>'};
const IC=k=>`<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${IP[k]}</svg>`;
let cg=0,ci=0,og=0,ce="assets",cf=null,flt={q:""};
function nav(){$("nav").innerHTML=`<div class="lg">${esc(S.cfg.co||"IT Desk")}</div>`+G.map((g,gi)=>{const ls=g[2].map((l,li)=>okG(g,l)?`<a tabindex="0" role="button" class="${gi===cg&&li===ci?"on":""}" onclick="go(${gi},${li})" onkeydown="if(event.key==='Enter')go(${gi},${li})">${esc(l[0])}</a>`:"").join("");return ls?`<button class="gh ${gi===cg?"on":""}" aria-expanded="${gi===og}" onclick="og=og===${gi}?-1:${gi};nav()"><span class="gl">${IC(g[1])}${g[0]}</span><span class="cv${gi===og?" up":""}">${IC("chev")}</span></button><div class="gb ${gi===og?"open":""}">${ls}</div>`:""}).join("")}
function go(g,i){cg=g;ci=i;og=g;show(G[g][2][i])}
function relog(){okG(G[cg],G[cg][2][ci])?go(cg,ci):go(0,0)}
function show(L){flt={q:""};cf=null;if(L[1]!=="p"){ce=L[2];cf=L[3]||null}
nav();$("bc").textContent="Home / "+G[cg][0]+" / "+L[0];$("ttl").textContent=L[0];
$("v").innerHTML=L[1]==="p"?PG[L[2]](L[3]):list(ce);
if(L[1]==="f"&&canEdit(ce))edit(ce)}
function gsearch(v){if(role()==="Employee")return;show(["Search results","l","assets"]);flt.q=v;$("q").value=v;$("tb").innerHTML=rows("assets")}
const opts=f=>({dept:()=>S.departments.map(x=>x.name),emp:()=>["",...S.employees.map(x=>x.name)],loc:()=>["",...S.locations.map(x=>x.name)],asset:()=>S.assets.map(x=>x.id+" "+x.name),tkt:()=>S.tickets.map(x=>x.id),ven:()=>["",...S.vendors.map(x=>x.name)]}[f[2]]||(()=>f[3]||[]))();
function badge(v){const g=["In Use","Resolved","Closed","In Stock","Low","Active","Done","Used","Free"],w=["Under Repair","Pending","Medium","In Progress","Assigned","Scheduled","Reserved"],b=["Lost","Retired","Critical","High","Open","Inactive","Disabled"];return`<span class="tag ${g.includes(v)?"g":w.includes(v)?"w":b.includes(v)?"b":""}">${esc(v)}</span>`}
const tbl=(h,r)=>`<div class="wrap"><table><thead><tr>${h.map(x=>`<th>${x}</th>`).join("")}</tr></thead><tbody>${r.map(x=>`<tr>${x.map(c=>`<td>${esc(c)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;
function list(n){const e=E[n];
const fs=e.fl.map(k=>{const f=e.f.find(x=>x[0]===k);return`<select data-f="${k}" aria-label="Filter by ${f[1]}"><option value="">All ${f[1].toLowerCase()}</option>${opts(f).filter(Boolean).map(o=>`<option>${esc(o)}</option>`).join("")}</select>`}).join("");
return`<div class="tools"><input id="q" type="search" placeholder="Search ${e.t.toLowerCase()}" aria-label="Search"> ${fs}${canEdit(n)?`<button class="p" onclick="edit('${n}')">Add</button>`:""}<button onclick="csv('${n}')">Export CSV</button><button onclick="print()">Print</button></div><div class="wrap"><table><thead><tr>${e.c.map(c=>`<th>${c==="id"?"ID":esc(e.f.find(x=>x[0]===c)[1])}</th>`).join("")}<th></th></tr></thead><tbody id="tb">${rows(n)}</tbody></table></div>`}
function rows(n){const e=E[n],q=(flt.q||"").toLowerCase();
const r=S[n].filter(x=>(!cf||cf(x))&&(role()!=="Employee"||n!=="tickets"||x.requester===(ME||"Employee A"))&&(!q||Object.values(x).join(" ").toLowerCase().includes(q))&&e.fl.every(k=>!flt[k]||x[k]===flt[k]));
if(!r.length)return`<tr><td colspan="${e.c.length+1}" class="empty">No records found.</td></tr>`;
return r.map(x=>`<tr>${e.c.map(c=>`<td>${c==="status"&&n==="tickets"&&role()!=="Employee"?`<select data-s="${x.id}" aria-label="Ticket status">${TST.map(s=>`<option${s===x.status?" selected":""}>${s}</option>`).join("")}</select>`:["status","priority"].includes(c)?badge(x[c]):esc(x[c])}</td>`).join("")}<td>${canEdit(n)&&role()!=="Employee"?`<button onclick="edit('${n}','${x.id}')">Edit</button>`:""}${role()==="Administrator"?` <button class="d" onclick="del('${n}','${x.id}')">Delete</button>`:""}</td></tr>`).join("")}
document.addEventListener("input",e=>{if(e.target.id==="q"){flt.q=e.target.value;$("tb").innerHTML=rows(ce)}});
document.addEventListener("change",e=>{const t=e.target;
if(t.dataset.f){flt[t.dataset.f]=t.value;$("tb").innerHTML=rows(ce)}
if(t.dataset.s){const k=S.tickets.find(x=>x.id===t.dataset.s);k.status=t.value;log(k.id+" status set to "+t.value);save();push("tickets",k);$("tb").innerHTML=rows(ce)}});
const DF={tickets:{status:"Open",priority:"Medium",created:iso(0)},assets:{status:"In Stock"},comments:{date:iso(0)},movements:{date:iso(0)},maintenance:{date:iso(0)},swrecords:{date:iso(0)}};
function edit(n,id){const e=E[n],r=id?S[n].find(x=>x.id===id):{...(DF[n]||{}),...(n==="tickets"&&ME?{requester:ME}:{})};
$("dlg").innerHTML=`<form method="dialog" onsubmit="return false"><h2>${id?"Edit":"Add"} ${e.t.toLowerCase()}</h2>${e.f.map(f=>{const t=f[2],v=esc(r[f[0]]);return`<label>${f[1]}`+(t==="area"?`<textarea name="${f[0]}" rows="2">${v}</textarea>`:t==="date"||!t?`<input name="${f[0]}" type="${t==="date"?"date":"text"}" value="${v}">`:`<select name="${f[0]}">${opts(f).map(o=>`<option${o===r[f[0]]?" selected":""}>${esc(o)}</option>`).join("")}</select>`)+"</label>"}).join("")}<div class="tools"><button class="p" onclick="saveRec('${n}','${id||""}')">Save changes</button><button onclick="$('dlg').close()">Cancel</button></div></form>`;$("dlg").showModal()}
async function saveRec(n,id){const e=E[n],fd=new FormData($("dlg").querySelector("form")),o={};e.f.forEach(f=>o[f[0]]=(fd.get(f[0])||"").trim());
if(!o[e.f[0][0]]&&n!=="tickets"){alert("Enter "+e.f[0][1].toLowerCase()+".");return}
let rec;if(id){rec=S[n].find(x=>x.id===id);Object.assign(rec,o)}else{let m;if(sb){const r=await sb.rpc("next_id",{p_entity:n});if(r.error){alert("Could not create the record: "+r.error.message);return}m=r.data}else m=Math.max(0,...S[n].map(x=>parseInt(x.id.split("-").pop())||0))+1;rec={id:e.p+pad(m,e.n),...o};S[n].push(rec)}
push(n,rec);
log((id?"edited ":"added ")+n+" "+(id||""));save();$("dlg").close();show(G[cg][2][ci])}
function del(n,id){if(confirm("Delete "+id+"? This cannot be undone.")){S[n]=S[n].filter(x=>x.id!==id);drop(n,id);log("deleted "+id);save();$("tb").innerHTML=rows(ce)}}
function csv(n,data,name){const rs=data||S[n].filter(x=>!cf||cf(x));if(!rs.length){alert("Nothing to export.");return}
const ks=Object.keys(rs[0]),q=v=>'"'+String(v??"").replace(/"/g,'""')+'"';
const a=document.createElement("a");a.href=URL.createObjectURL(new Blob(["\ufeff"+[ks.map(q).join(","),...rs.map(r=>ks.map(k=>q(r[k])).join(","))].join("\r\n")],{type:"text/csv"}));a.download=(name||n)+".csv";a.click()}
function theme(){const r=document.documentElement;r.dataset.theme=r.dataset.theme==="dark"?"light":"dark"}
function bk(){const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(S)],{type:"application/json"}));a.download="it-backup-"+iso(0)+".json";a.click()}
function rs(f){if(!f)return;if(sb){alert("Restore is available in local mode only.");return}const r=new FileReader();r.onload=()=>{try{const o=JSON.parse(r.result);if(!Array.isArray(o.assets)||!Array.isArray(o.tickets))throw 0;if(confirm("Replace all current data with this backup?")){S=o;save();go(0,0)}}catch(e){alert("This file is not a valid backup.")}};r.readAsText(f)}
function resetData(){if(sb){alert("Reset is available in local mode only.");return}if(confirm("Replace all data with the sample data?")){S=seed();save();go(0,0)}}
const PL=["#2e9e4f","#1b8a9a","#f28c28","#c0392b","#2f5597","#c27c0e","#7b5ea7","#8a8f98"],PC=["#2e9e4f","#c0392b","#1b8a9a","#2f5597","#7b5ea7","#4f6d7a","#c27c0e","#d35400","#a93226","#b9770e"];
const by=(a,f)=>{const m={};a.forEach(x=>{const k=f(x)||"None";m[k]=(m[k]||0)+1});return Object.entries(m).sort((p,q)=>q[1]-p[1])};
const donut=(t,it)=>{const tot=it.reduce((s,i)=>s+i[1],0);let c=0;const g=it.map((i,k)=>{const s=c;c+=i[1]/(tot||1)*100;return`${PL[k%8]} ${s}% ${c}%`}).join(",");return`<div class="cd"><h2>${t}</h2><div class="dn" style="background:conic-gradient(${g||"#ccc 0 100%"})"><span>${tot}</span></div><div class="lgd">${it.map((i,k)=>`<span><u style="background:${PL[k%8]}"></u>${esc(i[0])} ${i[1]}</span>`).join("")}</div></div>`};
const hb=(t,it)=>{const m=Math.max(1,...it.map(i=>i[1]));return`<div class="cd"><h2>${t}</h2>${it.slice(0,5).map(i=>`<div class="hb"><span title="${esc(i[0])}">${esc(i[0])}</span><i style="width:${i[1]/m*60}%"></i>${i[1]}</div>`).join("")||'<p class="note">No data.</p>'}</div>`};
const al=(t,it)=>`<div class="cd"><h2>${t}</h2>${it.map(i=>`<p>${i}</p>`).join("")||'<p class="note">Nothing to report.</p>'}</div>`;
const PG={
dash(){const a=S.assets,tk=S.tickets,op=tk.filter(live),cnt=(...c)=>a.filter(x=>c.includes(x.category)).length;
const T=[["Licenses",S.licenses.length,"🔑"],["Computers",cnt("Laptop","Desktop"),"💻"],["Network devices",cnt("Router","Switch","Access Point","Firewall"),"🌐"],["CCTV and NVR",cnt("CCTV","NVR"),"📹"],["Printers and scanners",cnt("Printer","Scanner"),"🖨"],["Servers",cnt("Server"),"🗄"],["Open tickets",op.length,"🎫"],["Late tickets",op.filter(t=>days(t.created)<-14).length,"⏰"],["Under repair",a.filter(x=>x.status==="Under Repair").length,"🔧"],["Warranty alerts",a.filter(wd).length,"⚠"]];
const T2=[["Active employees",S.employees.filter(x=>x.status==="Active").length],["Departments",S.departments.length],["Vendors",S.vendors.length],["Maintenance jobs",S.maintenance.length]];
const mo=Array.from({length:7},(_,i)=>{const d=new Date();d.setHours(12);d.setDate(1);d.setMonth(d.getMonth()-6+i);return d.toISOString().slice(0,7)});
const GS=[["New",["Open"],"#2f5597"],["Processing",["Assigned","In Progress"],"#f28c28"],["Pending",["Pending"],"#1b8a9a"],["Solved",["Resolved","Closed"],"#2e9e4f"]];
const col=mo.map(m=>GS.map(g=>tk.filter(t=>(t.created||"").slice(0,7)===m&&g[1].includes(t.status)).length));
const mx=Math.max(3,...col.map(c=>c.reduce((s,v)=>s+v,0)));
return`<div class="tiles">${T.map((t,i)=>`<div class="t" style="background:${PC[i]}"><div><b>${t[1]}</b><small>${t[0]}</small></div><span aria-hidden="true">${t[2]}</span></div>`).join("")}${T2.map(t=>`<div class="t g"><div><b>${t[1]}</b><small>${t[0]}</small></div></div>`).join("")}</div>
<div class="g3">${donut("Assets by status",by(a,x=>x.status))}${donut("Assets by category",by(a,x=>x.category))}${donut("Tickets by priority",by(tk,x=>x.priority))}</div>
<div class="g3"><div class="cd"><h2>Tickets status by month</h2><div class="sb">${col.map((c,i)=>`<div class="col"><div class="stk">${c.map((v,k)=>`<i title="${GS[k][0]}: ${v}" style="height:${v/mx*100}%;background:${GS[k][2]}"></i>`).join("")}</div><span>${mo[i].slice(2)}</span></div>`).join("")}</div><div class="lgd">${GS.map(g=>`<span><u style="background:${g[2]}"></u>${g[0]}</span>`).join("")}</div></div>${hb("Top ticket requesters",by(tk,x=>x.requester))}${hb("Top ticket categories",by(tk,x=>x.category))}</div>
<div class="g3">${al("Software license alerts",S.licenses.filter(x=>days(x.expires)<=60).map(x=>`${esc(x.software)} <span class="note">${days(x.expires)<0?"expired":"in "+days(x.expires)+" days"}</span>`))}${al("Warranty expiration alerts",a.filter(wd).map(x=>`${esc(x.id)} ${esc(x.name)} <span class="note">${days(x.warranty)<0?"expired":"in "+days(x.warranty)+" days"}</span>`))}${al("Recent IT activities",S.log.slice(0,5).map(esc))}</div>`},
log:(f="")=>`<div class="cd">${S.log.filter(l=>l.includes(f)).map(l=>`<p class="note">${esc(l)}</p>`).join("")||'<p class="note">No activity recorded yet.</p>'}</div>`,
comp:()=>tbl(["Software","Licenses","Installed","Status"],S.licenses.map(l=>{const u=S.swrecords.filter(r=>r.type==="Installation"&&r.software===l.software).length;return[l.software,l.seats,u,u>+l.seats?"Over-used":"Compliant"]})),
rep(c){const[n,k,s]=c,f=typeof k==="function"?k:x=>x[k],m={};S[n].forEach(x=>{const g=f(x)||"None";m[g]=m[g]||[0,0];m[g][0]++;m[g][1]+=parseFloat(x[s])||0});
const r=Object.entries(m).map(([g,v])=>[g,v[0],s?v[1]:""]);window.RG=r.map(x=>({group:x[0],count:x[1],total:x[2]}));
return`<div class="tools"><button onclick="csv('',RG,'report')">Export CSV</button><button onclick="print()">Print</button></div>`+tbl(["Group","Count",s?"Total":""],r)},
exp:()=>`<div class="cd"><p class="note">Download any table as a CSV file that opens in Excel.</p><div class="tools">${Object.keys(E).map(n=>`<button onclick="csv('${n}',S.${n},'${n}')">${E[n].t}</button>`).join("")}</div></div>`,
roles:()=>tbl(["Role","Permissions"],[["Administrator","Everything, including delete, users and settings"],["IT Technician","Manage assets, tickets, licenses, maintenance and network records; view reports"],["Employee","Create tickets, view own requests and the overview"]])+'<p class="note">This prototype only hides screens. A production build must enforce permissions on the server.</p>',
notif:()=>`<div class="cd">${[["n1","Email the IT team when a ticket is created"],["n2","Warn 30 days before a warranty ends"],["n3","Warn 60 days before a license ends"]].map(n=>`<label class="ck"><input type="checkbox" ${S.cfg[n[0]]?"checked":""} onchange="S.cfg['${n[0]}']=this.checked?1:0;save()"> ${n[1]}</label>`).join("")}<p class="note">Sending email needs the server backend. These choices are stored for it.</p></div>`,
backup:()=>`<div class="cd"><div class="tools"><button class="p" onclick="bk()">Download backup</button><label class="note">Restore from file <input type="file" accept=".json" onchange="rs(this.files[0])"></label></div><p class="note">Data lives in this browser only, so download a backup regularly.</p></div>`,
sys:()=>`<div class="cd"><label class="note">Company name<br><input value="${esc(S.cfg.co)}" onchange="S.cfg.co=this.value;save();nav()"></label><div class="tools" style="margin-top:12px"><button onclick="theme()">Switch light or dark theme</button>${role()==="Administrator"?'<button class="d" onclick="resetData()">Reset to sample data</button>':""}</div></div>`};
boot();
</script>
